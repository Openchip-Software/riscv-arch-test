# CI configuration for Sail reference model

ci_enabled: true
# Run the IME suites in their dedicated workflow job, with the Sail IME fork.
exclude_configs:
  - sail-rv64-experimental
exclude_extensions: []
shards: 1
config_shards:
  sail-RVA22S64-optional: 3
  sail-RVA23S64: 2
  sail-RVA23S64-optional: 4
  sail-RVB23S64-optional: 4
  sail-rv32-max: 4
  sail-rv32-max-clang: 4
  sail-rv64-max: 4
  sail-rv64-max-clang: 5
