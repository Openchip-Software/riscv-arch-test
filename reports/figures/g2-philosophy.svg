<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" role="img" aria-labelledby="g2-title g2-desc">
  <title id="g2-title">Where expected values come from and where the check runs</title>
  <desc id="g2-desc">ACT4 computes expected values with the Sail reference model at build time and embeds them as .results in a self-checking ELF that compares with RVTEST_SIGUPD on the DUT. ime-test-gen computes expected values with a Rust golden model at generation time and embeds them as const C_ref arrays in a hosted binary that compares in a C loop on QEMU under Linux.</desc>
  <defs>
    <marker id="g2-arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="440" fill="var(--ground)"/>

  <!-- column headers -->
  <g font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--muted)" text-anchor="middle">
    <text x="226" y="34">Test source</text>
    <text x="446" y="34">Expected values</text>
    <text x="666" y="34">Check</text>
    <text x="886" y="34">Verdict</text>
  </g>

  <!-- lanes -->
  <rect x="16" y="46" width="968" height="112" rx="8" fill="var(--surface-2)" stroke="var(--rule)" stroke-width="1"/>
  <rect x="16" y="174" width="968" height="112" rx="8" fill="var(--surface-2)" stroke="var(--rule)" stroke-width="1"/>
  <text x="28" y="107" font-family="var(--font-sans)" font-size="14" font-weight="700" fill="var(--accent)">ACT4</text>
  <text x="28" y="235" font-family="var(--font-sans)" font-size="13" font-weight="700" fill="var(--ink)">ime-test-gen</text>

  <!-- lane 1 boxes -->
  <rect x="136" y="58" width="180" height="88" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <rect x="356" y="58" width="180" height="88" rx="6" fill="var(--ref-soft)" stroke="var(--ref)" stroke-width="1.5"/>
  <rect x="576" y="58" width="180" height="88" rx="6" fill="var(--accent-2-soft)" stroke="var(--accent-2)" stroke-width="1.5"/>
  <rect x="796" y="58" width="180" height="88" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>

  <text x="173" y="96" font-family="var(--font-mono)" font-size="13" font-weight="700" fill="var(--ink)">.S</text>
  <text x="193" y="96" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)">from testgen</text>
  <text x="226" y="116" font-family="var(--font-sans)" font-size="11" fill="var(--muted)" text-anchor="middle">(inputs only)</text>

  <text x="446" y="84" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Sail reference model</text>
  <text x="446" y="103" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--ref)" text-anchor="middle">at build time</text>
  <text x="380" y="124" font-family="var(--font-sans)" font-size="12" fill="var(--ink)">→</text>
  <text x="396" y="124" font-family="var(--font-mono)" font-size="11" fill="var(--ref)">.results</text>
  <text x="458" y="124" font-family="var(--font-sans)" font-size="12" fill="var(--ink)">embedded</text>

  <text x="666" y="82" font-family="var(--font-mono)" font-size="12" font-weight="700" fill="var(--ink)" text-anchor="middle">RVTEST_SIGUPD</text>
  <g font-family="var(--font-sans)" font-size="12" fill="var(--ink)" text-anchor="middle">
    <text x="666" y="100">compare in the</text>
    <text x="666" y="116">self-checking ELF</text>
    <text x="666" y="132">on the DUT</text>
  </g>

  <g font-family="var(--font-mono)" font-size="11" fill="var(--ink)" text-anchor="middle">
    <text x="886" y="82">RVCP-SUMMARY:</text>
    <text x="886" y="97">TEST PASSED/FAILED</text>
    <text x="886" y="120" fill="var(--accent)">+ run_tests.py</text>
    <text x="886" y="135" fill="var(--accent)">summary.log</text>
  </g>

  <!-- lane 2 boxes -->
  <rect x="136" y="186" width="180" height="88" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>
  <rect x="356" y="186" width="180" height="88" rx="6" fill="var(--ref-soft)" stroke="var(--ref)" stroke-width="1.5"/>
  <rect x="576" y="186" width="180" height="88" rx="6" fill="var(--accent-2-soft)" stroke="var(--accent-2)" stroke-width="1.5"/>
  <rect x="796" y="186" width="180" height="88" rx="6" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5"/>

  <text x="226" y="224" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">C++ from ime-test-gen</text>
  <text x="226" y="244" font-family="var(--font-sans)" font-size="11" fill="var(--muted)" text-anchor="middle">(inputs + references)</text>

  <text x="446" y="212" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">Rust golden model</text>
  <text x="446" y="231" font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--ref)" text-anchor="middle">at generation time</text>
  <text x="446" y="252" font-family="var(--font-mono)" font-size="11" fill="var(--ref)" text-anchor="middle">→ const C_ref[]</text>

  <text x="666" y="212" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="middle">C compare loop</text>
  <g font-family="var(--font-sans)" font-size="12" fill="var(--ink)" text-anchor="middle">
    <text x="666" y="230">in the hosted binary</text>
    <text x="666" y="246">on QEMU/Linux</text>
  </g>

  <g font-family="var(--font-mono)" font-size="11" fill="var(--ink)" text-anchor="middle">
    <text x="886" y="214">PASS/FAIL/SKIP lines</text>
    <text x="886" y="238" fill="var(--muted)">+ check.sh vs</text>
    <text x="886" y="253" fill="var(--muted)">known-issues</text>
  </g>

  <!-- arrows -->
  <g fill="none" stroke="var(--ink)" stroke-width="1.5">
    <line x1="316" y1="102" x2="354" y2="102" marker-end="url(#g2-arrow-ink)"/>
    <line x1="536" y1="102" x2="574" y2="102" marker-end="url(#g2-arrow-ink)"/>
    <line x1="756" y1="102" x2="794" y2="102" marker-end="url(#g2-arrow-ink)"/>
    <line x1="316" y1="230" x2="354" y2="230" marker-end="url(#g2-arrow-ink)"/>
    <line x1="536" y1="230" x2="574" y2="230" marker-end="url(#g2-arrow-ink)"/>
    <line x1="756" y1="230" x2="794" y2="230" marker-end="url(#g2-arrow-ink)"/>
  </g>

  <!-- comparison strip -->
  <rect x="16" y="350" width="968" height="24" fill="var(--surface-2)"/>
  <rect x="16" y="398" width="968" height="24" fill="var(--surface-2)"/>
  <g font-family="var(--font-sans)" font-size="12" font-weight="700">
    <text x="180" y="318" fill="var(--accent)">ACT4</text>
    <text x="590" y="318" fill="var(--ink)">ime-test-gen</text>
  </g>
  <line x1="16" y1="326" x2="984" y2="326" fill="none" stroke="var(--rule)" stroke-width="1"/>
  <g font-family="var(--font-sans)" font-size="12" font-weight="600" fill="var(--muted)">
    <text x="24" y="342">Expected values</text>
    <text x="24" y="366">Coverage</text>
    <text x="24" y="390">Environment</text>
    <text x="24" y="414">Parameterization</text>
  </g>
  <g font-family="var(--font-sans)" font-size="12" fill="var(--ink)">
    <text x="180" y="342">executable spec (Sail)</text>
    <text x="180" y="366">covergroups measure bins</text>
    <text x="180" y="390">bare-metal, M→S/U-mode, T-SBI</text>
    <text x="180" y="414">test header params (MXLEN, VLEN) + UDB selection</text>
    <text x="590" y="342">independent golden model (Rust, tuned to QEMU rounding)</text>
    <text x="590" y="366">exhaustive enumeration of legal configurations</text>
    <text x="590" y="390">Linux user mode, libc printf</text>
    <text x="590" y="414">runtime --vlen guard</text>
  </g>
</svg>
