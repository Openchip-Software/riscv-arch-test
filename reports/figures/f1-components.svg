  <text x="173" y="40" font-family="var(--font-mono)" font-size="13" fill="var(--accent)">(make tests)</text>
  <text x="488" y="40" font-family="var(--font-sans)" font-size="14" font-weight="600" fill="var(--accent)">Build</text>
  <text x="533" y="40" font-family="var(--font-mono)" font-size="13" fill="var(--accent)">(act)</text>
  <text x="780" y="40" font-family="var(--font-sans)" font-size="14" font-weight="600" fill="var(--accent-2)">Run</text>
  <text x="814" y="40" font-family="var(--font-mono)" font-size="13" fill="var(--accent-2)">(run_tests.py)</text>

