<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" role="img" aria-labelledby="f1-title">
  <title id="f1-title">ACT components and data flow: make tests generates test sources and covergroups, act builds self-checking ELFs from a DUT configuration with UDB, GCC and the Sail reference model, and run_tests.py runs the ELFs on the DUT and writes logs and a summary.</title>
