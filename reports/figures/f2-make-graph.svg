<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 612" width="100%" role="img" aria-labelledby="f2-title">
  <title id="f2-title">Make targets and the programs they call: make tests runs covergroupgen and testgen behind stamp files, make (elfs) runs act, config targets build and then run run_tests.py per config, coverage builds with --coverage, regression chains clean, coverage, elfs and run_tests.py, and clean deletes work/ files except extensions.txt and .validated.</title>
  <defs>
    <marker id="f2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker>
    <marker id="f2-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
    <marker id="f2-arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent-2)"/></marker>
  </defs>

  <!-- Column headings -->
  <text x="40" y="30" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)">Make targets</text>
  <text x="492" y="30" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)">Phony targets</text>
  <text x="692" y="30" font-family="var(--font-sans)" font-size="13" font-weight="600" fill="var(--ink)">Programs</text>
  <line x1="40" y1="38" x2="984" y2="38" stroke="var(--rule)" stroke-width="1" fill="none"/>

  <!-- C2: make tests, make (elfs) -->
  <rect x="344" y="93" width="132" height="32" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="410" y="113" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">make tests</text>
  <rect x="344" y="200" width="132" height="42" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="410" y="217" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">make</text>
  <text x="410" y="233" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">(= elfs)</text>
  <line x1="410" y1="200" x2="410" y2="127" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <text x="417" y="168" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">prerequisite</text>

  <!-- C3: phony targets -->
  <rect x="492" y="44" width="160" height="54" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="572" y="62" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">covergroupgen</text>
  <text x="572" y="77" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">work/stamps/</text>
  <text x="572" y="91" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">covergroupgen.stamp</text>
  <rect x="492" y="120" width="160" height="54" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="572" y="138" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">testgen</text>
  <text x="572" y="153" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">work/stamps/</text>
  <text x="572" y="167" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">testgen.stamp</text>
  <line x1="476" y1="104" x2="490" y2="75" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <line x1="476" y1="114" x2="490" y2="143" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>

  <!-- C4: programs -->
  <rect x="692" y="55" width="292" height="32" rx="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="704" y="75" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">covergroupgen testplans</text>
  <rect x="692" y="131" width="292" height="32" rx="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="704" y="151" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">testgen testplans -o tests</text>
  <line x1="652" y1="71" x2="690" y2="71" stroke="var(--accent)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow-accent)"/>
  <line x1="652" y1="147" x2="690" y2="147" stroke="var(--accent)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow-accent)"/>

  <rect x="692" y="184" width="292" height="72" rx="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="704" y="201" font-family="var(--font-mono)" font-size="11" font-weight="600" fill="var(--ink)">act $(CONFIG_FILES)</text>
  <text x="716" y="216" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">--workdir work --test-dir tests</text>
  <text x="716" y="231" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">--jobs N [--extensions] [--debug]</text>
  <text x="716" y="246" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">[--fast] [--coverage]</text>
  <line x1="476" y1="220" x2="690" y2="220" stroke="var(--accent)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow-accent)"/>
  <text x="576" y="214" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">runs</text>

  <rect x="692" y="300" width="292" height="42" rx="4" fill="var(--accent-2-soft)" stroke="var(--accent-2)" stroke-width="1.5"/>
  <text x="704" y="317" font-family="var(--font-mono)" font-size="11" font-weight="600" fill="var(--ink)">./run_tests.py "$(cat run_cmd.txt)"</text>
  <text x="716" y="333" font-family="var(--font-mono)" font-size="11" fill="var(--ink)">work/&lt;cfg&gt;/elfs</text>

  <!-- C1: entry targets -->
  <rect x="40" y="190" width="224" height="60" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="52" y="208" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">make coverage</text>
  <text x="52" y="226" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">default CONFIG_FILES =</text>
  <text x="52" y="241" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">sail-rv64-max + sail-rv32-max</text>

  <rect x="40" y="280" width="224" height="76" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="52" y="298" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">make &lt;config-target&gt;</text>
  <text x="52" y="314" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">e.g. make sail-rv64-max</text>
  <text x="52" y="331" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">sub-make: CONFIG_FILES = each</text>
  <text x="52" y="346" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">test_config.yaml under that dir</text>

  <rect x="40" y="390" width="224" height="42" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="52" y="408" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">make regression</text>
  <text x="52" y="424" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">continues through failures</text>

  <rect x="40" y="470" width="224" height="32" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>
  <text x="52" y="490" font-family="var(--font-mono)" font-size="12" font-weight="600" fill="var(--ink)">make clean</text>

  <!-- C1 edges -->
  <line x1="264" y1="220" x2="342" y2="220" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <text x="303" y="214" text-anchor="middle" font-family="var(--font-mono)" font-size="11" fill="var(--muted)">--coverage</text>
  <line x1="264" y1="290" x2="362" y2="244" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <text x="270" y="268" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">sub-make</text>
  <polyline points="40,292 22,292 22,109 342,109" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <line x1="264" y1="320" x2="690" y2="320" stroke="var(--accent-2)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow-2)"/>
  <text x="576" y="314" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--accent-2)">per config</text>

  <line x1="264" y1="398" x2="434" y2="244" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <text x="318" y="364" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">all run configs</text>
  <polyline points="264,416 838,416 838,344" stroke="var(--accent-2)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow-2)"/>
  <text x="576" y="410" text-anchor="middle" font-family="var(--font-sans)" font-size="11" fill="var(--accent-2)">per run config</text>
  <polyline points="40,404 30,404 30,226 38,226" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <line x1="152" y1="432" x2="152" y2="468" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <text x="158" y="455" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">first</text>

  <!-- clean -->
  <line x1="264" y1="486" x2="342" y2="486" stroke="var(--muted)" stroke-width="1.5" fill="none" marker-end="url(#f2-arrow)"/>
  <rect x="344" y="470" width="340" height="32" rx="4" fill="var(--surface-2)" stroke="var(--rule)" stroke-width="1"/>
  <text x="356" y="490" font-family="var(--font-sans)" font-size="11" fill="var(--ink)">delete <tspan font-family="var(--font-mono)">work/</tspan> files except <tspan font-family="var(--font-mono)">extensions.txt</tspan>, <tspan font-family="var(--font-mono)">.validated</tspan></text>

  <!-- Notes -->
  <text x="40" y="532" font-family="var(--font-sans)" font-size="11" fill="var(--muted)">Arrow between targets: prerequisite or sub-make. Arrow into a program: the recipe runs it.</text>
  <text x="40" y="552" font-family="var(--font-sans)" font-size="12" fill="var(--ink)">Variables: <tspan font-family="var(--font-mono)" font-size="11">CONFIG_FILES, EXTENSIONS, EXCLUDE_EXTENSIONS, DEBUG, FAST, VERBOSE (=DEBUG+JOBS=1), JOBS (from -j)</tspan></text>
  <rect x="40" y="570" width="620" height="28" rx="14" fill="var(--surface)" stroke="var(--bad)" stroke-width="1.5"/>
  <text x="56" y="588" font-family="var(--font-sans)" font-size="12" fill="var(--bad)">Stamps ignore <tspan font-family="var(--font-mono)" font-size="11">EXTENSIONS</tspan>: after <tspan font-family="var(--font-mono)" font-size="11">EXTENSIONS=I make tests</tspan>, a full <tspan font-family="var(--font-mono)" font-size="11">make tests</tspan> does nothing.</text>
</svg>
