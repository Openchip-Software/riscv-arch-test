#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: param_schema.json#
kind: parameter
name: SUPPORTED_LAMBDA_SEW16
long_name: Lambda values supported when SEW=16
description: |
  The nonzero lambda values that the implementation supports for the
  `vtype.lambda[2:0]` field when SEW=16. SEW is the element width of
  the C accumulator tile.

  The specification makes the supported set an implementation-defined
  function of VLEN and SEW ("Selected lambda (`lambda[2:0]`) field").
  VLEN is fixed by the configuration, so one list per SEW describes the
  function completely.

  A lambda value is architecturally permissible only when
  EMUL_C = VLEN / (SEW * lambda^2^) is in {1, 2, 4, 8, 16}.
  For every IME-legal (VLEN, SEW), at least one permissible value must be
  supported, so the list is never empty.

  A write of an unsupported nonzero lambda through `vsetvl` selects the
  largest supported value that is not greater than the request, or the
  smallest supported value. A tile load or store with an unsupported
  immediate lambda raises an illegal-instruction exception.
schema:
  type: array
  items:
    type: integer
    enum: [1, 2, 4, 8, 16, 32, 64]
  minItems: 1
  maxItems: 7
  uniqueItems: true
definedBy:
  extension:
    anyOf:
      - name: Zvvmm
      - name: Zvvfmm
      - name: Zvvmtls
      - name: Zvvmttls
requirements:
  idl(): |
    $array_includes?(SUPPORTED_LAMBDA_SEW16, 1) -> (VLEN >= 16) && (VLEN <= 256);
    $array_includes?(SUPPORTED_LAMBDA_SEW16, 2) -> (VLEN >= 64) && (VLEN <= 1024);
    $array_includes?(SUPPORTED_LAMBDA_SEW16, 4) -> (VLEN >= 256) && (VLEN <= 4096);
    $array_includes?(SUPPORTED_LAMBDA_SEW16, 8) -> (VLEN >= 1024) && (VLEN <= 16384);
    $array_includes?(SUPPORTED_LAMBDA_SEW16, 16) -> (VLEN >= 4096) && (VLEN <= 65536);
    $array_includes?(SUPPORTED_LAMBDA_SEW16, 32) -> VLEN >= 16384;
    $array_includes?(SUPPORTED_LAMBDA_SEW16, 64) -> VLEN >= 65536;
  reason: |
    Each supported lambda must give EMUL_C = VLEN / (16 * lambda^2) in {1, 2, 4, 8, 16}.
