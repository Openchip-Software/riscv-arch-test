#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: "ext_schema.json#"
kind: extension
name: Zvvmtls
long_name: Matrix tile load and store for vector register groups
description: |
  The Zvvmtls extension provides the order-preserving tile load `vmtl.v`
  and tile store `vmts.v`. They move 2D matrix tiles of SEW-bit storage
  elements between memory and vector register groups, using the tile
  geometry selected by SEW, VL, LMUL and lambda.
type: unprivileged
versions:
  - version: "1.0.0"
    state: development
    repositories:
      - url: https://github.com/riscv/integrated-matrix-extension
        branch: main
requirements:
  extension:
    name: Zve32x
