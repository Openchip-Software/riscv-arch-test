#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: "ext_schema.json#"
kind: extension
name: Zvvi4i8mm
long_name: Matrix multiply-accumulate, [U]Int4 inputs, Int8 accumulator
description: |
  Enables the Zvvmm matrix multiply-accumulate encodings with
  [U]Int4 A and B input elements and Int8 C accumulator
  elements. The encoding maps in the specification name this extension in
  the rows that it makes legal.

  The specification lists Zve32x as the dependency of Zvvi4i8mm.
type: unprivileged
versions:
  - version: "1.0.0"
    state: development
    repositories:
      - url: https://github.com/riscv/integrated-matrix-extension
        branch: main
requirements:
  extension:
    allOf:
      - name: Zvvmm
      - name: Zve32x
