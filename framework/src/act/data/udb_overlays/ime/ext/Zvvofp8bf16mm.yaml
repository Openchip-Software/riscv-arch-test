#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: "ext_schema.json#"
kind: extension
name: Zvvofp8bf16mm
long_name: Matrix multiply-accumulate, OFP8 (E4M3 or E5M2) inputs, BFloat16 accumulator
description: |
  Enables the Zvvfmm matrix multiply-accumulate encodings with
  OFP8 (E4M3 or E5M2) A and B input elements and BFloat16 C accumulator
  elements. The encoding maps in the specification name this extension in
  the rows that it makes legal.

  The specification lists Zve32f as the dependency of Zvvofp8bf16mm.
type: unprivileged
versions:
  - version: "1.0.0"
    state: development
    repositories:
      - url: https://github.com/riscv/integrated-matrix-extension
        branch: main
requirements:
  extension:
    allOf:
      - name: Zvvfmm
      - name: Zve32f
