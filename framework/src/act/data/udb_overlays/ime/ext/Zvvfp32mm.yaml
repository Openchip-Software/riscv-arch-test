# SPDX-License-Identifier: BSD-3-Clause-Clear OR Apache-2.0
#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: "ext_schema.json#"
kind: extension
name: Zvvfp32mm
long_name: Matrix multiply-accumulate, IEEE binary32 inputs, IEEE binary32 accumulator
description: |
  Enables the Zvvfmm matrix multiply-accumulate encodings with
  IEEE binary32 A and B input elements and IEEE binary32 C accumulator
  elements. The encoding maps in the specification name this extension in
  the rows that it makes legal.

  The specification lists Zve32f as the dependency of Zvvfp32mm.
type: unprivileged
versions:
  - version: "1.0.0"
    state: development
    repositories:
      - url: https://github.com/riscv/integrated-matrix-extension
        branch: main
requirements:
  extension:
    allOf:
      - name: Zvvfmm
      - name: Zve32f
