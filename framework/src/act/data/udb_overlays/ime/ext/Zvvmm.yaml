#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: "ext_schema.json#"
kind: extension
name: Zvvmm
long_name: Integer matrix multiply-accumulate on vector register groups
description: |
  The Zvvmm family extension provides the integer matrix tile
  multiply-accumulate instructions `vmmacc.vv` (W=1), `vwmmacc.vv` (W=2),
  `vqmmacc.vv` (W=4) and `v8wmmacc.vv` (W=8). They compute
  C <- C + A x B^T^ on matrix tiles held in vector register groups.

  The input and accumulator types that are legal for each instruction are
  selected by the individual extensions (`Zvvi4i8mm` ... `Zvvi64mm`).
  Each individual integer extension requires Zvvmm.
type: unprivileged
versions:
  - version: "1.0.0"
    state: development
    repositories:
      - url: https://github.com/riscv/integrated-matrix-extension
        branch: main
requirements:
  extension:
    name: Zve32x
