#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: "ext_schema.json#"
kind: extension
name: Zvvxofp4ofp8mm
long_name: Microscaled matrix multiply-accumulate, MXFP4 inputs, OFP8 accumulator, block size 32
description: |
  Enables the `vm=0` (`v0.scale`) encodings of the Zvvfmm matrix
  multiply-accumulate instructions for E8M0-scaled MXFP4 A and B input
  elements, OFP8 C accumulator elements and block size 32
  (`vtype.bs` = 0).

  The specification states that Zvvxofp4ofp8mm implies Zvvofp4ofp8mm.
type: unprivileged
versions:
  - version: "1.0.0"
    state: development
    repositories:
      - url: https://github.com/riscv/integrated-matrix-extension
        branch: main
requirements:
  extension:
    allOf:
      - name: Zvvfmm
      - name: Zvvofp4ofp8mm
