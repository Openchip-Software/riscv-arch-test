#
# Zvvm (Integrated Matrix Extension) definition for the ACT UDB overlay.
# Source: https://github.com/riscv/integrated-matrix-extension/blob/6effbcae3204e5a8a9c9d15ff53959918144870c/src/integrated-matrix.adoc

$schema: "ext_schema.json#"
kind: extension
name: Zvvxni8fp64mm
long_name: Microscaled matrix multiply-accumulate, MXINT8 inputs, IEEE binary64 accumulator, block size 16
description: |
  Enables the `vm=0` (`v0.scale`) encodings of the Zvvfmm matrix
  multiply-accumulate instructions for E8M0-scaled MXINT8 A and B input
  elements, IEEE binary64 C accumulator elements and block size 16
  (`vtype.bs` = 1).

  The specification states that Zvvxni8fp64mm implies Zvvxi8fp64mm.
type: unprivileged
versions:
  - version: "1.0.0"
    state: development
    repositories:
      - url: https://github.com/riscv/integrated-matrix-extension
        branch: main
requirements:
  extension:
    allOf:
      - name: Zvvfmm
      - name: Zvvxi8fp64mm
